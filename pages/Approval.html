<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="/images/fav-logo.png" sizes="32x32" type="image/x-icon">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <title>Users | HostelFinder Admin</title>
</head>
<body class="bg-[#F9FAFB] font-[Manrope] min-h-screen">

    <!-- ══════════════════════════════════════════
         ADMIN HEADER
    ══════════════════════════════════════════ -->
    <header class="w-full bg-white shadow-[0_2px_8px_rgba(49,87,213,0.10)] sticky top-0 z-30">
        <div class="max-w-[1440px] mx-auto flex items-center justify-between px-4 sm:px-6 md:px-10 py-3 gap-4">
            <a href="/pages/Dashboard.html">
                <img class="w-40" src="/images/hostel-finder-logo.png" alt="HostelFinder logo">
            </a>
            <nav class="xl:flex gap-8 hidden items-center">
                <a href="/pages/Dashboard.html" class="text-sm font-semibold text-[#3157D5] underline">Dashboard</a>
                <a href="/pages/Approval.html" class="text-sm font-medium text-[#2D2340] hover:text-[#3157D5] hover:underline transition">Properties</a>
                <a href="/pages/Inspections.html" class="text-sm font-medium text-[#2D2340] hover:text-[#3157D5] hover:underline transition">Inspections</a>
                <a href="/pages/Admin-login.html" class="text-sm font-medium text-[#2D2340] hover:text-[#3157D5] hover:underline transition">Settings</a>
            </nav>
            <button id="menu-btn" type="button"
                class="rounded-md border border-[#3157D5] px-2 py-1 text-2xl text-[#3157D5] xl:hidden"
                aria-label="Open menu">
                <i id="menu-icon" class="bx bx-menu"></i>
            </button>
        </div>
        <div id="mobile-overlay" class="fixed inset-0 z-40 hidden bg-black/50 opacity-0 transition-opacity duration-300 xl:hidden"></div>
        <aside id="mobile-menu"
            class="fixed inset-y-0 left-0 z-50 flex w-72 max-w-[85vw] -translate-x-full flex-col justify-between bg-white p-6 shadow-xl transition-transform duration-300 xl:hidden">
            <div>
                <div class="flex items-center justify-between border-b border-gray-100 pb-5">
                    <img class="w-32" src="/images/hostel-finder-logo.png" alt="HostelFinder logo">
                    <button id="close-menu-btn" type="button" class="text-3xl text-gray-400 hover:text-gray-700">
                        <i class="bx bx-x"></i>
                    </button>
                </div>
                <nav class="mt-6 flex flex-col gap-5 text-sm">
                    <a href="/pages/Dashboard.html" class="font-semibold text-[#3157D5] underline">Dashboard</a>
                    <a href="/pages/Approval.html" class="font-medium text-[#2D2340] hover:text-[#3157D5]">Properties</a>
                    <a href="/pages/Inspections.html" class="font-medium text-[#2D2340] hover:text-[#3157D5]">Inspections</a>
                    <a href="/pages/Admin-login.html" class="font-medium text-[#2D2340] hover:text-[#3157D5]">Settings</a>
                </nav>
            </div>
            <a href="/pages/Admin-login.html"
                class="block text-center rounded-md bg-[#3157D5] px-4 py-3 text-sm font-bold text-white hover:bg-[#2646b5]">Logout</a>
        </aside>
    </header>

    <!-- ══════════════════════════════════════════
         MAIN
    ══════════════════════════════════════════ -->
    <main class="max-w-[1440px] mx-auto px-4 sm:px-6 md:px-10 py-8 pb-16">

        <!-- Back + Title -->
        <div class="flex items-center gap-3 mb-6">
            <a href="/pages/Dashboard.html" class="text-[#2D2340] hover:text-[#3157D5] transition">
                <i class="bx bx-arrow-back text-2xl"></i>
            </a>
            <h1 class="text-2xl font-extrabold text-[#2D2340]">Users</h1>
        </div>

        <!-- Tabs — Landlords Approval | Students Reviews -->
        <div class="flex items-center gap-6 border-b border-gray-200 mb-6">
            <button id="tab-landlords-btn"
                class="tab-btn pb-3 text-sm font-semibold text-[#3157D5] border-b-2 border-[#3157D5] -mb-px transition cursor-pointer">
                Landlords Approval
            </button>
            <button id="tab-reviews-btn"
                class="tab-btn pb-3 text-sm font-medium text-gray-500 border-b-2 border-transparent hover:text-[#3157D5] -mb-px transition cursor-pointer">
                Students Reviews
            </button>
        </div>

        <!-- ══════════════════════════════════════
             TAB 1 — Landlords Approval
        ══════════════════════════════════════ -->
        <div id="tab-landlords" class="tab-content">

            <!-- Stat cards -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
                <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-xs">
                    <p class="text-[11px] font-semibold text-gray-500">Pending Approval</p>
                    <h4 class="text-xl font-extrabold text-gray-900 mt-1">3</h4>
                </div>
                <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-xs">
                    <p class="text-[11px] font-semibold text-gray-500">Approved</p>
                    <h4 class="text-xl font-extrabold text-gray-900 mt-1">80</h4>
                </div>
                <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-xs">
                    <p class="text-[11px] font-semibold text-gray-500">Rejected</p>
                    <h4 class="text-xl font-extrabold text-gray-900 mt-1">5</h4>
                </div>
                <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-xs">
                    <p class="text-[11px] font-semibold text-gray-500">Reported</p>
                    <h4 class="text-xl font-extrabold text-gray-900 mt-1">1</h4>
                </div>
            </div>

            <!-- Filter pills -->
            <div class="flex items-center gap-2 flex-wrap mb-4">
                <button data-lfilter="all"
                    class="landlord-filter flex-shrink-0 bg-[#3157D5] text-white text-xs font-semibold px-5 py-2 rounded-xl cursor-pointer transition">All</button>
                <button data-lfilter="pending"
                    class="landlord-filter flex-shrink-0 bg-white border border-gray-200 text-gray-600 text-xs font-semibold px-5 py-2 rounded-xl hover:border-[#3157D5] cursor-pointer transition">Pending</button>
                <button data-lfilter="approved"
                    class="landlord-filter flex-shrink-0 bg-white border border-gray-200 text-gray-600 text-xs font-semibold px-5 py-2 rounded-xl hover:border-[#3157D5] cursor-pointer transition">Approved</button>
                <button data-lfilter="rejected"
                    class="landlord-filter flex-shrink-0 bg-white border border-gray-200 text-gray-600 text-xs font-semibold px-5 py-2 rounded-xl hover:border-[#3157D5] cursor-pointer transition">Rejected</button>
                <button data-lfilter="reported"
                    class="landlord-filter flex-shrink-0 bg-white border border-gray-200 text-gray-600 text-xs font-semibold px-5 py-2 rounded-xl hover:border-[#3157D5] cursor-pointer transition">Reported</button>
            </div>

            <!-- Search -->
            <div class="relative mb-6 max-w-xl">
                <i class="bx bx-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                <input type="search" id="landlord-search" placeholder="Search by landlord"
                    class="w-full bg-white border border-gray-200 rounded-xl pl-10 pr-4 py-2.5 text-sm text-gray-700 outline-none focus:border-[#3157D5] focus:ring-2 focus:ring-[#3157D5]/15 transition">
            </div>

            <!-- Landlord cards -->
            <div class="space-y-4" id="landlord-cards">
                <!-- Populated by JS -->
            </div>

        </div>

        <!-- ══════════════════════════════════════
             TAB 2 — Students Reviews
        ══════════════════════════════════════ -->
        <div id="tab-reviews" class="tab-content hidden">

            <!-- Stat cards -->
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-4 mb-6">
                <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-xs">
                    <p class="text-[11px] font-semibold text-gray-500">Pending Reports</p>
                    <h4 class="text-xl font-extrabold text-gray-900 mt-1">9</h4>
                </div>
                <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-xs">
                    <p class="text-[11px] font-semibold text-gray-500">Total Reviews</p>
                    <h4 class="text-xl font-extrabold text-gray-900 mt-1">83</h4>
                </div>
                <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-xs">
                    <p class="text-[11px] font-semibold text-gray-500">High Rating (4–5 stars)</p>
                    <h4 class="text-xl font-extrabold text-gray-900 mt-1">46</h4>
                </div>
                <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-xs">
                    <p class="text-[11px] font-semibold text-gray-500">Low Rating (1–2 stars)</p>
                    <h4 class="text-xl font-extrabold text-gray-900 mt-1">14</h4>
                </div>
                <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-xs">
                    <p class="text-[11px] font-semibold text-gray-500">Flagged</p>
                    <h4 class="text-xl font-extrabold text-gray-900 mt-1">13</h4>
                </div>
            </div>

            <!-- Filter pills -->
            <div class="flex items-center gap-2 flex-wrap mb-4">
                <button data-rfilter="all"
                    class="review-filter flex-shrink-0 bg-[#3157D5] text-white text-xs font-semibold px-5 py-2 rounded-xl cursor-pointer transition">All</button>
                <button data-rfilter="pending"
                    class="review-filter flex-shrink-0 bg-white border border-gray-200 text-gray-600 text-xs font-semibold px-5 py-2 rounded-xl hover:border-[#3157D5] cursor-pointer transition">Pending</button>
                <button data-rfilter="approved"
                    class="review-filter flex-shrink-0 bg-white border border-gray-200 text-gray-600 text-xs font-semibold px-5 py-2 rounded-xl hover:border-[#3157D5] cursor-pointer transition">Approved</button>
                <button data-rfilter="rejected"
                    class="review-filter flex-shrink-0 bg-white border border-gray-200 text-gray-600 text-xs font-semibold px-5 py-2 rounded-xl hover:border-[#3157D5] cursor-pointer transition">Rejected</button>
                <button data-rfilter="reported"
                    class="review-filter flex-shrink-0 bg-white border border-gray-200 text-gray-600 text-xs font-semibold px-5 py-2 rounded-xl hover:border-[#3157D5] cursor-pointer transition">Reported</button>
            </div>

            <!-- Search -->
            <div class="relative mb-6 max-w-xl">
                <i class="bx bx-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                <input type="search" id="review-search" placeholder="Search by student, property, or report reason"
                    class="w-full bg-white border border-gray-200 rounded-xl pl-10 pr-4 py-2.5 text-sm text-gray-700 outline-none focus:border-[#3157D5] focus:ring-2 focus:ring-[#3157D5]/15 transition">
            </div>

            <!-- Review cards -->
            <div class="space-y-4" id="review-cards">
                <!-- Populated by JS -->
            </div>

        </div>

    </main>

    <script src="../script.js"></script>
    <script>
        /* ══════════════════════════════════════
           TAB SWITCHING
        ══════════════════════════════════════ */
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        function activateTab(id) {
            tabBtns.forEach(b => {
                const active = b.id === 'tab-' + id + '-btn';
                b.classList.toggle('text-[#3157D5]', active);
                b.classList.toggle('border-[#3157D5]', active);
                b.classList.toggle('font-semibold', active);
                b.classList.toggle('text-gray-500', !active);
                b.classList.toggle('border-transparent', !active);
                b.classList.toggle('font-medium', !active);
            });
            tabContents.forEach(c => c.classList.toggle('hidden', c.id !== 'tab-' + id));
        }

        document.getElementById('tab-landlords-btn').addEventListener('click', () => activateTab('landlords'));
        document.getElementById('tab-reviews-btn').addEventListener('click', () => activateTab('reviews'));

        /* ══════════════════════════════════════
           LANDLORD DATA
        ══════════════════════════════════════ */
        const landlords = [
            { id: 'l1', name: 'Olu Adeniire', email: 'adeniiroolu@gmail.com', avatar: 'https://i.pravatar.cc/80?img=12', status: 'pending' },
            { id: 'l2', name: 'Rachel Badiinra', email: 'Avortelnp@gmail.com', avatar: 'https://i.pravatar.cc/80?img=25', status: 'pending' },
            { id: 'l3', name: 'Smith Wilson', email: 'sthsoxsmith4b@gmail.com', avatar: 'https://i.pravatar.cc/80?img=33', status: 'pending' },
            { id: 'l4', name: 'Maryann Phillips', email: 'phillipsmaryann21@gmail.com', avatar: 'https://i.pravatar.cc/80?img=47', status: 'pending' },
        ];

        let lFilter = 'all';

        function renderLandlords() {
            const container = document.getElementById('landlord-cards');
            const search = document.getElementById('landlord-search').value.toLowerCase();
            const filtered = landlords.filter(l => {
                const matchFilter = lFilter === 'all' || l.status === lFilter;
                const matchSearch = l.name.toLowerCase().includes(search) || l.email.toLowerCase().includes(search);
                return matchFilter && matchSearch;
            });

            container.innerHTML = filtered.map(l => `
                <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <img src="${l.avatar}" alt="${l.name}" class="w-14 h-14 rounded-full object-cover flex-shrink-0 border-2 border-gray-100">
                        <div>
                            <p class="text-sm font-bold text-[#2D2340]">${l.name}</p>
                            <p class="text-xs text-gray-500 mt-0.5">${l.email}</p>
                            <div class="flex items-center gap-2 mt-2">
                                <button class="text-[11px] font-semibold border border-[#3157D5] text-[#3157D5] px-3 py-1 rounded-lg hover:bg-[#e8edfc] transition cursor-pointer">View Info</button>
                                <button class="text-[11px] font-semibold border border-[#3157D5] text-[#3157D5] px-3 py-1 rounded-lg hover:bg-[#e8edfc] transition cursor-pointer">View Gov ID</button>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 sm:ml-auto">
                        <button onclick="approveLandlord('${l.id}')"
                            class="bg-[#3157D5] hover:bg-[#2646b5] text-white text-xs font-bold px-6 py-2.5 rounded-xl transition cursor-pointer">
                            Approve
                        </button>
                        <button onclick="rejectLandlord('${l.id}')"
                            class="border border-red-400 text-red-500 hover:bg-red-50 text-xs font-bold px-6 py-2.5 rounded-xl transition cursor-pointer">
                            Reject
                        </button>
                    </div>
                </div>
            `).join('') || '<p class="text-sm text-gray-400 text-center py-8">No landlords found.</p>';
        }

        function approveLandlord(id) {
            const l = landlords.find(x => x.id === id);
            if (l) { l.status = 'approved'; renderLandlords(); }
        }
        function rejectLandlord(id) {
            const l = landlords.find(x => x.id === id);
            if (l) { l.status = 'rejected'; renderLandlords(); }
        }

        document.querySelectorAll('.landlord-filter').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.landlord-filter').forEach(b => {
                    b.classList.remove('bg-[#3157D5]', 'text-white');
                    b.classList.add('bg-white', 'border', 'border-gray-200', 'text-gray-600');
                });
                btn.classList.remove('bg-white', 'border', 'border-gray-200', 'text-gray-600');
                btn.classList.add('bg-[#3157D5]', 'text-white');
                lFilter = btn.dataset.lfilter;
                renderLandlords();
            });
        });

        document.getElementById('landlord-search').addEventListener('input', renderLandlords);

        /* ══════════════════════════════════════
           REVIEW DATA
        ══════════════════════════════════════ */
        const reviews = [
            {
                id: 'r1', property: 'Sunrise Lodge', location: 'Adebayo ogunleye · Ikeja, Lagos.',
                reviewer: 'Chinonso Olufor', time: '4 hrs ago', rating: 3,
                comment: 'The apartment is clean, self-furnished and in a good location. The Landlord is supercalive and very respectful. No issues so far.', status: 'none'
            },
            {
                id: 'r2', property: 'The Green Homes', location: 'Adebayo ogunleye · Ikeja, Lagos.',
                reviewer: 'Prosper Ashesi', time: '5 hrs ago', rating: 0,
                comment: 'Wrong description. The description on the property says self-contain but it was actually a shared apartment.', status: 'flagged'
            },
            {
                id: 'r3', property: 'Oasis Hostel', location: 'Abagbo, Lagos.',
                reviewer: 'Femi Thomas', time: '1 day ago', rating: 2,
                comment: 'The environment is peaceful and the landlord is friendly. Just a little far from the main road, but it\'s worth it.', status: 'review'
            },
            {
                id: 'r4', property: 'The Green Homes', location: 'Adebayo ogunleye · Ikeja, Lagos.',
                reviewer: 'Prosper Ashesi', time: '2 days ago', rating: 0,
                comment: 'Wrong description. The description on the property says self-contain but it was actually a shared apartment.', status: 'flagged'
            },
            {
                id: 'r5', property: 'Oasis Hostel', location: 'Abagbo, Lagos.',
                reviewer: 'Femi Thomas', time: '1 day ago', rating: 4,
                comment: 'The environment is peaceful and the landlord is friendly. Just a little far from the main road, but it\'s worth it.', status: 'review'
            },
        ];

        let rFilter = 'all';

        function stars(n) {
            return Array.from({ length: 5 }, (_, i) =>
                `<i class="bx bx-star text-sm ${i < n ? 'text-amber-400' : 'text-gray-300'}"></i>`
            ).join('');
        }

        function renderReviews() {
            const container = document.getElementById('review-cards');
            const search = document.getElementById('review-search').value.toLowerCase();
            const filtered = reviews.filter(r => {
                const mf = rFilter === 'all' || r.status === rFilter ||
                    (rFilter === 'flagged' && r.status === 'flagged') ||
                    (rFilter === 'pending' && r.status === 'none');
                const ms = r.property.toLowerCase().includes(search) || r.reviewer.toLowerCase().includes(search);
                return mf && ms;
            });

            container.innerHTML = filtered.map(r => {
                const badge = r.status === 'flagged'
                    ? `<span class="text-[10px] font-bold bg-red-100 text-red-600 px-3 py-1 rounded-full">Flagged</span>`
                    : r.status === 'review'
                    ? `<span class="text-[10px] font-bold bg-[#3157D5] text-white px-3 py-1 rounded-full">Review</span>`
                    : '';

                return `
                    <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-xs">
                        <div class="flex items-start justify-between gap-3 mb-2">
                            <div>
                                <p class="text-sm font-bold text-[#2D2340]">${r.property}</p>
                                <p class="text-xs text-gray-500 mt-0.5">${r.location}</p>
                            </div>
                            <div class="flex items-center gap-2 flex-shrink-0">
                                <div class="flex">${stars(r.rating)}</div>
                                ${badge}
                            </div>
                        </div>
                        <p class="text-xs text-[#2D2340] font-semibold flex items-center gap-1">
                            ${r.reviewer} <span class="text-gray-400 font-normal">· ${r.time}</span>
                        </p>
                        <p class="text-xs text-gray-500 mt-2 leading-relaxed">${r.comment}</p>
                    </div>
                `;
            }).join('') || '<p class="text-sm text-gray-400 text-center py-8">No reviews found.</p>';
        }

        document.querySelectorAll('.review-filter').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.review-filter').forEach(b => {
                    b.classList.remove('bg-[#3157D5]', 'text-white');
                    b.classList.add('bg-white', 'border', 'border-gray-200', 'text-gray-600');
                });
                btn.classList.remove('bg-white', 'border', 'border-gray-200', 'text-gray-600');
                btn.classList.add('bg-[#3157D5]', 'text-white');
                rFilter = btn.dataset.rfilter;
                renderReviews();
            });
        });

        document.getElementById('review-search').addEventListener('input', renderReviews);

        /* Init */
        document.addEventListener('DOMContentLoaded', () => {
            renderLandlords();
            renderReviews();
        });
    </script>
</body>
</html>
