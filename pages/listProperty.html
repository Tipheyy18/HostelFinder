    <!-- Script for mobile navbar and interactive image uploads -->
    <script src="../script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('drop-zone');
            const mediaInput = document.getElementById('media-input');
            const previewContainer = document.getElementById('media-preview-container');

            if (dropZone && mediaInput && previewContainer) {
                dropZone.addEventListener('click', () => mediaInput.click());

                dropZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    dropZone.classList.add('bg-[#EFE5FD]', 'border-[#7956C8]');
                });

                dropZone.addEventListener('dragleave', () => {
                    dropZone.classList.remove('bg-[#EFE5FD]', 'border-[#7956C8]');
                });

                dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('bg-[#EFE5FD]', 'border-[#7956C8]');
                    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                        handleFiles(e.dataTransfer.files);
                    }
                });

                mediaInput.addEventListener('change', () => {
                    if (mediaInput.files && mediaInput.files.length > 0) {
                        handleFiles(mediaInput.files);
                    }
                });

                function handleFiles(files) {
                    Array.from(files).forEach(file => {
                        if (file.type.startsWith('image/')) {
                            const reader = new FileReader();
                            reader.onload = (e) => {
                                const card = document.createElement('div');
                                card.className = 'relative group aspect-[4/3] rounded-2xl overflow-hidden shadow-xs border border-[#E2DBF0] bg-gray-100';
                                card.innerHTML = `
                                    <img src="${e.target.result}" alt="Uploaded photo" class="w-full h-full object-cover">
                                    <button type="button" onclick="this.parentElement.remove()" class="absolute top-2 right-2 bg-black/60 hover:bg-black text-white w-6 h-6 rounded-full flex items-center justify-center text-sm transition cursor-pointer" aria-label="Remove image">
                                        <i class="bx bx-x"></i>
                                    </button>
                                `;
                                previewContainer.appendChild(card);
                            };
                            reader.readAsDataURL(file);
                        }
                    });
                }
            }

            const form = document.getElementById('property-form');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    window.location.href = '/pages/landlord-details.html';
                });
            }
        });
    </script>
