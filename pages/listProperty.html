<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="/images/fav-logo.png" sizes="32x32" type="image/x-icon">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <title>Landlord Details | HostelFinder</title>
</head>
<body class="bg-[#F9FAFB] font-[Manrope] min-h-screen">

    <div class="container w-full md:px-10 px-4 mx-auto">
        <header
            class="w-full flex items-center justify-between p-4 bg-[#F9FAFB] shadow-[0_4px_4px_rgba(37,99,235,0.15)]">
            <a href="/">
                <img class="w-48" src="/images/hostel-finder-logo.png" alt="Hostel finder logo">
            </a>
          
            <nav class="xl:flex gap-8 hidden items-center">
                <a href="/" class="text-base font-medium text-[#2D2340] hover:text-[#3157D5] hover:underline transition">Home</a>
                <a href="/pages/listProperty.html" class="text-base font-semibold text-[#3157D5] underline">List Your Property</a>
            </nav>

            <div class="hidden xl:flex items-center gap-4">
                <a data-auth-login href="/pages/login.html" class="text-base font-medium text-[#2D2340] hover:text-[#3157D5] transition">Log In</a>
                <a data-auth-signup href="/pages/signup.html">
                    <button class="capitalize bg-[#3157D5] text-white text-base px-4 py-2 rounded-md hover:bg-[#2646b5] cursor-pointer transition">Create Account</button>
                </a>
                <button data-auth-logout type="button" hidden
                    class="capitalize bg-[#3157D5] text-white text-base px-4 py-2 rounded-md hover:bg-[#2646b5] cursor-pointer transition">
                    Logout
                </button>
            </div>

            <button id="menu-btn" type="button"
                class="rounded-md border border-[#3157D5] px-2 py-1 text-2xl text-[#3157D5] xl:hidden"
                aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobile-menu">
                <i id="menu-icon" class="bx bx-menu" aria-hidden="true"></i>
            </button>
        </div>

        <div id="mobile-overlay" class="fixed inset-0 z-40 hidden bg-black/50 opacity-0 transition-opacity duration-300 xl:hidden"></div>

        <aside id="mobile-menu"
            class="fixed inset-y-0 left-0 z-50 flex w-72 max-w-[85vw] -translate-x-full flex-col justify-between bg-white p-6 shadow-xl transition-transform duration-300 xl:hidden"
            aria-label="Mobile navigation">
            <div>
                <div class="flex items-center justify-between border-b border-gray-100 pb-5">
                    <a href="/"><img class="w-36" src="/images/hostel-finder-logo.png" alt="HostelFinder logo"></a>
                    <button id="close-menu-btn" type="button" class="text-3xl text-gray-500 hover:text-gray-800">
                        <i class="bx bx-x"></i>
                    </button>
                </div>
                <nav class="mt-6 flex flex-col gap-5">
                    <a href="/" class="font-medium text-[#2D2340] hover:text-[#3157D5]">Home</a>
 
                    <a href="/pages/listProperty.html" class="font-semibold text-[#3157D5] underline">List Your Property</a>
                    <a data-auth-login href="/pages/login.html" class="font-medium text-[#2D2340] hover:text-[#3157D5]">Log In</a>
                </nav>
            </div>
            <div class="flex flex-col gap-3">
                <a data-auth-signup href="/pages/signup.html"
                    class="rounded-md bg-[#3157D5] px-4 py-3 text-center text-base font-bold text-white hover:bg-[#2646b5]">Create Account</a>
                <button data-auth-logout type="button" hidden
                    class="w-full rounded-md bg-[#3157D5] px-4 py-3 text-base font-bold text-white hover:bg-[#2646b5] cursor-pointer">
                    Logout
                </button>
            </div>
        </aside>
    </header>
    </div>

    <main class="container mx-auto px-4 sm:px-6 md:px-10 py-8 pb-16">
        <div class="relative mb-8 flex items-center justify-center max-w-xl mx-auto">
            <a href="/pages/listProperty.html"
                class="absolute left-0 text-[#2D2340] hover:text-[#3157D5] transition"
                aria-label="Go back">
                <i class="bx bx-arrow-back text-2xl sm:text-3xl"></i>
            </a>
            <h1 class="text-2xl sm:text-3xl font-bold text-[#2D2340] tracking-tight">Landlord Details</h1>
        </div>

        <!-- Form card -->
        <div class="bg-white rounded-3xl p-5 sm:p-8 shadow-sm border border-gray-100 max-w-xl mx-auto">
            <form id="landlord-form" class="space-y-5" novalidate>

                <div>
                    <label for="fullName" class="block text-xs sm:text-sm font-semibold text-[#2D2340] mb-1.5">Full Name*</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Chinedu Okafor" value="Chinedu Okafor" required
                        class="w-full bg-white border border-[#E2DBF0] rounded-xl px-4 py-3 text-sm text-[#2D2340] placeholder-[#A098AE] outline-none focus:border-[#3157D5] focus:ring-2 focus:ring-[#3157D5]/20 transition">
                </div>

                <div>
                    <label for="email" class="block text-xs sm:text-sm font-semibold text-[#2D2340] mb-1.5">Email Address*</label>
                    <input type="email" id="email" name="email" placeholder="name@gmail.com" value="name@gmail.com" required
                        class="w-full bg-white border border-[#E2DBF0] rounded-xl px-4 py-3 text-sm text-[#2D2340] placeholder-[#A098AE] outline-none focus:border-[#3157D5] focus:ring-2 focus:ring-[#3157D5]/20 transition">
                </div>

                <div>
                    <label for="phone" class="block text-xs sm:text-sm font-semibold text-[#2D2340] mb-1.5">Phone Number*</label>
                    <input type="tel" id="phone" name="phone" placeholder="+234 8140772324" value="+234 8140772324" required
                        class="w-full bg-white border border-[#E2DBF0] rounded-xl px-4 py-3 text-sm text-[#2D2340] placeholder-[#A098AE] outline-none focus:border-[#3157D5] focus:ring-2 focus:ring-[#3157D5]/20 transition">
                </div>

                <div>
                    <label for="idType" class="block text-xs sm:text-sm font-semibold text-[#2D2340] mb-1.5">Means of Identification*</label>
                    <div class="relative">
                        <select id="idType" name="idType" required
                            class="w-full bg-white border border-[#E2DBF0] rounded-xl px-4 py-3 text-sm text-[#2D2340] outline-none focus:border-[#3157D5] focus:ring-2 focus:ring-[#3157D5]/20 transition appearance-none cursor-pointer">
                            <option value="" disabled selected>e.g. National ID</option>
                            <option value="NIN">National Identity Card (NIN)</option>
                            <option value="Passport">International Passport</option>
                            <option value="DriversLicense">Driver's License</option>
                            <option value="VotersCard">Voter's Card</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-[#3157D5]">
                            <i class="bx bx-chevron-down text-xl"></i>
                        </div>
                    </div>
                </div>

                <div>
                    <label for="idNumber" class="block text-xs sm:text-sm font-semibold text-[#2D2340] mb-1.5">ID Number*</label>
                    <input type="text" id="idNumber" name="idNumber" placeholder="12345678901" value="12345678901" required
                        class="w-full bg-white border border-[#E2DBF0] rounded-xl px-4 py-3 text-sm text-[#2D2340] placeholder-[#A098AE] outline-none focus:border-[#3157D5] focus:ring-2 focus:ring-[#3157D5]/20 transition">
                </div>

                <div>
                    <label for="accountNumber" class="block text-xs sm:text-sm font-semibold text-[#2D2340] mb-1.5">Account Number*</label>
                    <input type="text" id="accountNumber" name="accountNumber" placeholder="0123456789" required
                        class="w-full bg-white border border-[#E2DBF0] rounded-xl px-4 py-3 text-sm text-[#2D2340] placeholder-[#A098AE] outline-none focus:border-[#3157D5] focus:ring-2 focus:ring-[#3157D5]/20 transition">
                </div>

                <div>
                    <label for="bankName" class="block text-xs sm:text-sm font-semibold text-[#2D2340] mb-1.5">Bank Name*</label>
                    <input type="text" id="bankName" name="bankName" placeholder="First Bank" required
                        class="w-full bg-white border border-[#E2DBF0] rounded-xl px-4 py-3 text-sm text-[#2D2340] placeholder-[#A098AE] outline-none focus:border-[#3157D5] focus:ring-2 focus:ring-[#3157D5]/20 transition">
                </div>

                <!-- Required Documents -->
                <div class="pt-4 border-t border-gray-100">
                    <h2 class="text-base font-bold text-[#2D2340] mb-4">Required Documents</h2>

                    <!-- Government ID -->
                    <div class="bg-white border border-gray-200 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <div class="w-11 h-11 rounded-xl bg-[#E8EDFC] text-[#3157D5] flex items-center justify-center text-xl flex-shrink-0">
                                <i class="bx bx-id-card"></i>
                            </div>
                            <span class="font-bold text-[#2D2340] text-sm">Government ID</span>
                        </div>
                        <div id="drop-govid"
                            class="border-2 border-dashed border-[#B8C8F8] bg-[#F4F7FE] hover:bg-[#E8EDFC] rounded-xl px-4 py-2.5 flex items-center gap-2 cursor-pointer transition">
                            <input type="file" id="govid-file" class="hidden" accept="image/*,.pdf">
                            <i class="bx bx-upload text-[#3157D5] text-sm"></i>
                            <span id="govid-label" class="text-xs font-medium text-[#3157D5]">
                                Drag &amp; Drop file here, or <span class="underline font-semibold">upload</span>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Next button -->
                <div class="pt-2">
                    <button type="submit"
                        class="w-full bg-[#3157D5] hover:bg-[#2646b5] text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition cursor-pointer text-sm sm:text-base active:scale-[0.99]">
                        Next
                    </button>
                </div>

            </form>
        </div>

    </main>

    <script src="../script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Government ID dropzone
            const dropGovid = document.getElementById('drop-govid');
            const govidFile = document.getElementById('govid-file');
            const govidLabel = document.getElementById('govid-label');
            if (dropGovid) {
                dropGovid.addEventListener('click', () => govidFile.click());
                govidFile.addEventListener('change', () => {
                    if (govidFile.files && govidFile.files[0])
                        govidLabel.innerHTML = `<span class="font-semibold text-green-700"><i class="bx bx-check-circle align-middle mr-1 text-sm"></i>${govidFile.files[0].name}</span>`;
                });
            }

          
            const form = document.getElementById('landlord-form');
            if (form) {
                form.addEventListener('submit', e => {
                    e.preventDefault();
                    const landlordData = {
                        fullName: document.getElementById('fullName')?.value.trim() || 'Chinedu Okafor',
                        email: document.getElementById('email')?.value.trim() || 'name@gmail.com',
                        phone: document.getElementById('phone')?.value.trim() || '+234 8140772324',
                        idType: document.getElementById('idType')?.value || 'National ID',
                        idNumber: document.getElementById('idNumber')?.value.trim() || '12345678901',
                        accountNumber: document.getElementById('accountNumber')?.value.trim() || '0123456789',
                        bankName: document.getElementById('bankName')?.value.trim() || 'First Bank',
                    };
                    localStorage.setItem('hostelfinder_landlord_details', JSON.stringify(landlordData));
                    window.location.href = '/pages/property-information.html';
                });
            }
        });
    </script>
</body>
</html>
