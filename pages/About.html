!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="/images/fav-logo.png" sizes="32x32" type="image/x-icon">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Original+Surfer&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <title>Browse Properties | HostelFinder</title>
    <style type="text/tailwindcss">
        @layer utilities {
            .range-purple::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: #7956C8;
                cursor: pointer;
            }
            .range-purple::-webkit-slider-runnable-track {
                background: #d8b4fe;
                border-radius: 9999px;
                height: 4px;
            }
            .range-purple {
                -webkit-appearance: none;
                appearance: none;
                width: 100%;
                height: 4px;
                background: #d8b4fe;
                border-radius: 9999px;
                outline: none;
            }
        }
    </style>
</head>
<body class="bg-[#E6D8FC] font-[Manrope]">

    <!-- ===== HEADER ===== -->
    <header class="w-full flex items-center justify-between px-6 md:px-10 py-4 shadow-[0_4px_4px_rgba(37,99,235,0.15)] bg-[#E6D8FC]">
        <a href="/">
            <img class="w-44" src="https://res.cloudinary.com/ospauzp7/image/upload/v1790628256/HostelFinderLogo.png" alt="HostelFinder logo">
        </a>

        <nav class="xl:flex gap-8 hidden">
            <a href="/" class="text-sm font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline">Home</a>
            <a href="/pages/browse.html" class="text-sm font-semibold text-[#7956C8] underline">Browse Properties</a>
            <a href="/pages/List Property.html" class="text-sm font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline">List Your Property</a>
            <a href="/pages/login.html" class="text-sm font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline">Log In</a>
        </nav>

        <a href="/pages/signup.html" class="xl:block hidden">
            <button class="capitalize bg-[#7956C8] text-white text-sm px-4 py-2 rounded-md hover:bg-[#4a2f82] cursor-pointer transition">
                Create Account
            </button>
        </a>

        <!-- Mobile menu icon -->
        <div class="block xl:hidden">
            <i class="bx bx-menu text-[#7956C8] text-3xl border border-[#7956C8] rounded-md cursor-pointer px-1"></i>
        </div>
    </header>

    <!-- ===== HERO SECTION ===== -->
    <section class="text-center pt-10 pb-6 px-4">
        <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 leading-tight">
            Find Your <span class="text-[#7956C8]">Dream</span><br>
            <span class="text-[#7956C8]">Space</span> Off Campus
        </h1>
        <p class="mt-3 text-gray-500 text-sm">
            Browse various spaces with costs, distance and<br class="hidden sm:block">
            availability in view
        </p>
    </section>
