<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="/images/fav-logo.png" sizes="32x32" type="image/x-icon">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Original+Surfer&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <title>Inspection Completed | HostelFinder</title>
</head>
<body class="bg-[#E6D8FC] font-[Manrope] min-h-screen">

    <!-- ===== HEADER ===== -->
    <header class="w-full flex items-center justify-between px-6 md:px-10 py-4 shadow-[0_4px_4px_rgba(37,99,235,0.15)] bg-[#E6D8FC]">
        <a href="/"><img class="w-44" src="https://res.cloudinary.com/ospauzp7/image/upload/v1790628256/HostelFinderLogo.png" alt="HostelFinder logo"></a>
        <nav class="xl:flex gap-8 hidden">
            <a href="/" class="text-sm font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline">Home</a>
            <a href="/pages/browse.html" class="text-sm font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline">Browse Properties</a>
            <a href="/pages/your-inspection.html" class="text-sm font-semibold text-[#7956C8] underline">View Your Inspection</a>
            <a href="#" class="text-sm font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline">Settings</a>
        </nav>
        <div class="block xl:hidden">
            <i class="bx bx-menu text-[#7956C8] text-3xl border border-[#7956C8] rounded-md cursor-pointer px-1"></i>
        </div>
    </header>

    <!-- ===== PAGE TITLE ===== -->
    <div class="max-w-3xl mx-auto px-4 pt-6 pb-2 flex items-center gap-3">
        <a href="/pages/your-inspection.html" class="text-gray-700 hover:text-[#7956C8] transition">
            <i class="bx bx-arrow-back text-2xl"></i>
        </a>
        <h1 class="text-2xl font-extrabold text-gray-900">Your Inspection</h1>
    </div>

    <!-- ===== MAIN ===== -->
    <main class="max-w-3xl mx-auto px-4 pb-16 pt-2">

        <!-- Outer light-purple wrapper -->
        <div class="bg-[#f0ebfc] rounded-3xl p-6 md:p-10">

            <!-- White inner card -->
            <div class="bg-white rounded-2xl shadow-[0_4px_24px_rgba(121,86,200,0.12)] max-w-sm mx-auto overflow-hidden px-5 pt-6 pb-5">

                <!-- Back arrow inside card (top-left) -->
                <div class="mb-3">
                    <a href="/pages/your-inspection.html" class="text-gray-500 hover:text-[#7956C8] transition">
                        <i class="bx bx-arrow-back text-lg"></i>
                    </a>
                </div>

                <!-- Purple verified badge icon -->
                <div class="flex justify-center mb-2">
                    <div class="w-14 h-14 bg-[#7956C8] rounded-full flex items-center justify-center shadow-[0_4px_16px_rgba(121,86,200,0.40)]">
                        <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                </div>

                <!-- Inspection Completed title -->
                <div class="text-center mb-4">
                    <h2 class="text-base font-extrabold text-gray-900 mb-0.5">Inspection Completed!</h2>
                    <p class="text-xs text-gray-400">Your inspection for Greenfields Court is done.</p>
                </div>

                <!-- Property image -->
                <div class="rounded-xl overflow-hidden mb-4">
                    <img src="https://res.cloudinary.com/ospauzp7/image/upload/v1790627411/22404c7a9e7cce6b24a8f09f9f0a8e6f5544e648.png"
                         alt="Greenfields Court" class="w-full h-40 object-cover">
                </div>

                <!-- Inspection confirmation row with toggle ON -->
                <div class="border border-[#ede8f8] rounded-xl px-4 py-2.5 flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2">
                        <div class="w-5 h-5 rounded-full bg-[#ede8f8] flex items-center justify-center flex-shrink-0">
                            <i class="bx bx-check-shield text-[#7956C8] text-xs"></i>
                        </div>
                        <span class="text-xs text-gray-500">Inspection confirmation</span>
                    </div>
                    <!-- Toggle ON -->
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="sr-only peer" checked>
                        <div class="w-9 h-5 bg-gray-200 rounded-full peer peer-checked:bg-[#7956C8] after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-4 after:shadow"></div>
                    </label>
                </div>

                <!-- Proceed with Property — solid purple -->
                <button class="w-full bg-[#7956C8] hover:bg-[#4a2f82] text-white font-semibold text-sm py-3 rounded-xl transition mb-3">
                    Proceed with Property
                </button>

                <!-- Reject Property — red outline -->
                <button class="w-full border-2 border-red-400 text-red-500 hover:bg-red-50 font-semibold text-sm py-3 rounded-xl transition mb-4">
                    Reject Property
                </button>

                <!-- Review Property section -->
                <div class="border border-[#ede8f8] rounded-xl px-4 py-3">
                    <!-- Star rating row -->
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs font-semibold text-gray-700">Review Property</span>
                        <div class="flex items-center gap-1" id="stars">
                            <!-- 4 filled, 1 empty by default -->
                            <i class="bx bxs-star text-[#7956C8] text-base cursor-pointer star" data-val="1"></i>
                            <i class="bx bxs-star text-[#7956C8] text-base cursor-pointer star" data-val="2"></i>
                            <i class="bx bxs-star text-[#7956C8] text-base cursor-pointer star" data-val="3"></i>
                            <i class="bx bxs-star text-[#7956C8] text-base cursor-pointer star" data-val="4"></i>
                            <i class="bx bx-star text-gray-300 text-base cursor-pointer star" data-val="5"></i>
                        </div>
                    </div>

                    <!-- Review text area -->
                    <div class="relative">
                        <textarea
                            placeholder="Add your review..."
                            rows="3"
                            class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs text-gray-600 placeholder-gray-300 outline-none focus:border-[#7956C8] resize-none transition pr-8"
                        ></textarea>
                        <!-- Send icon inside textarea -->
                        <button class="absolute bottom-3 right-2 text-[#7956C8] hover:text-[#4a2f82] transition">
                            <i class="bx bx-send text-base"></i>
                        </button>
                    </div>

                    <!-- Report link -->
                    <div class="flex justify-center mt-3">
                        <button class="text-[10px] text-[#7956C8] hover:underline flex items-center gap-1">
                            <i class="bx bx-flag text-xs"></i> Report Property if necessary
                        </button>
                    </div>
                </div>

            </div>

           
            <div class="mt-5 max-w-sm mx-auto">
                <a href="/">
                    <button class="w-full text-[#ede5f9] border border-[#d5c7f7] bg-[#7956C8]  font-bold text-sm py-3.5 rounded-2xl transition cursor-pointer">
                        Back to Home
                    </button>
                </a>
            </div>

        </div>
    </main>

    <script>
        // Star rating interaction
        const stars = document.querySelectorAll('.star');
        stars.forEach(star => {
            star.addEventListener('click', function () {
                const val = parseInt(this.getAttribute('data-val'));
                stars.forEach((s, i) => {
                    if (i < val) {
                        s.className = 'bx bxs-star text-[#7956C8] text-base cursor-pointer star';
                    } else {
                        s.className = 'bx bx-star text-gray-300 text-base cursor-pointer star';
                    }
                });
            });

            star.addEventListener('mouseover', function () {
                const val = parseInt(this.getAttribute('data-val'));
                stars.forEach((s, i) => {
                    if (i < val) {
                        s.style.color = '#7956C8';
                    } else {
                        s.style.color = '#d1d5db';
                    }
                });
            });

            star.addEventListener('mouseout', function () {
                stars.forEach(s => { s.style.color = ''; });
            });
        });
    </script>

</body>
</html>
