<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="/images/fav-logo.png" sizes="32*32" type="image/x-icon">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Surfer -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Original+Surfer&display=swap" rel="stylesheet">
    <!-- DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <!-- Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <title>SignUp | HostelFinder</title>
</head>
<body class="bg-[#E6D8FC]">
    <main class="container w-full md:px-10 px-4 pb-28 mx-auto">
        <header class="w-full flex items-center justify-between p-4 shadow-[0_4px_4px_rgba(37,99,235,0.149)]">
            <a href="/">
                <img class="w-48" src="https://res.cloudinary.com/ospauzp7/image/upload/v1790628256/HostelFinderLogo.png" alt="Hostel finder logo">
            </a>

            <nav class="xl:flex gap-8 hidden">
                <a href="/" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline cursor-pointer">Home</a>
                <a href="/pages/browse.html" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline cursor-pointer">Browse Hostel</a>
                <a href="/pages/listProperty.html" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline cursor-pointer">List your property</a>
                <a href="/pages/login.html" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline cursor-pointer">Login</a>
            </nav>

            <button class="xl:block hidden capitalize bg-[#7956C8] text-white text-sm px-2 pb-3 py-2 rounded-md hover:bg-[#4a2f82] cursor-pointer">create account</button>
            <div class="block xl:hidden">
                <i class="bx bx-menu-close text-[#7956C8] text-3xl border border-[#7956C8] rounded-md cursor-pointer"></i>
            </div>
        </header>
        <section class="bg-[#F7F3FD] mt-20 pt-6 pb-30 px-4">
            <div class="bg-[#F0E9FB] lg:w-160 w-full pt-8 lg:px-8 px-4 pb-20 mx-auto">
                <h3 class="font-manrope capitalize text-center font-bold text-[28px]">create your account</h3>
                <p class="font-dm capitalize text-center text-base font-normal mt-1 mb-3">join & find your ideal hostel</p>

                <form action="#">
                    <div class="w-full flex flex-col mb-2">
                        <label for="fullName" class="font-semibold text-sm mb-2 text-[#0f172a]">Full Name</label>
                        <input 
                            class="p-4 bg-white rounded-[14px] border border-transparent outline-none focus:outline-none focus:border-[#7956C8] focus:ring-1" 
                            type="text" 
                            placeholder="Chinedu Okafor"
                        >
                    </div>
                    <div class="w-full flex flex-col mb-2">
                        <label for="email" class="font-semibold text-sm mb-2 text-[#0f172a]">Email Address</label>
                        <input 
                            type="email"
                            placeholder="name@gmail.com"
                            class="p-4 bg-white rounded-[14px] border border-transparent outline-none focus:outline-none focus:border-[#7956C8] focus:ring-1" 
                        >
                    </div>  
                     <div class="w-full flex flex-col mb-2">
                        <label for="phoneNumber" class="font-semibold text-sm mb-2 text-[#0f172a]">Phone Number</label>
                        <input 
                            type="text" 
                            placeholder="+234 8162 772 324"
                            class="p-4 bg-white rounded-[14px] border border-transparent outline-none focus:outline-none focus:border-[#7956C8] focus:ring-1" 
                        >
                    </div>
                    <div class="w-full flex flex-col mb-2">
                        <label for="password" class="font-semibold text-sm mb-2 text-[#0f172a]">Password</label>
                        <div class="relative w-full">
                            <input 
                                type="password" 
                                placeholder="At least 8 characters"
                                class="w-full p-4 bg-white rounded-[14px] border border-transparent outline-none focus:outline-none focus:border-[#7956C8] focus:ring-1" 
                            >
                            <i class="absolute right-3 top-3 text-[30px] text-[#7c7188] bx bx-eye"></i>
                        </div>
                    </div>
                    <div class="w-full flex flex-col mb-2">
                        <label for="confirmPassword" class="font-semibold text-sm mb-2 text-[#0f172a]">Confirm Password</label>
                        <div class="relative w-full">
                            <input 
                                type="password" 
                                placeholder="Repeat your pasword"
                                class="w-full p-4 bg-white rounded-[14px] border border-transparent outline-none focus:outline-none focus:border-[#7956C8] focus:ring-1" 
                            >
                            <i class="absolute right-3 top-3 text-[30px] text-[#7c7188] bx bx-eye"></i>
                        </div>
                    </div>
                    <div class="w-full flex gap-2">
                        <input type="checkbox">
                        <p class="text-sm font-normal my-5 text-[#2d2340]">I agree to the <span class="capitalize text-[#7956C8]">terms and conditions</span> and <span class="capitalize text-[#7956C8]">privacy policy</span></p>
                    </div>
                    <button class="capitalize bg-[#7956C8] text-white text-base font-semibold w-full py-4 rounded-2xl shadow-[0_4px_12px_rgba(37,99,235,0.149) hover:bg-[#4a2f82] cursor-pointer">
                        create account
                    </button>
                </form>
                <div class="mt-10 mb-7 flex items-center justify-center gap-4">
                    <div class="bg-[#d3cae1] h-px md:w-[35%] w-[20%]"></div>
                    <p class="uppercase sm:text-sm text-xs text-[#94A3B8]">or sign up with</p>
                    <div class="bg-[#d3cae1] h-px md:w-[35%] w-[20%]"></div>
                </div>
                <div class="flex gap-6 w-fit mx-auto">
                    <div class="w-20 h-20 bg-white flex items-center justify-center rounded-full hover:scale-105 cursor-pointer">
                        <img 
                            src="/images/apple-icon.png" 
                            alt="apple logo"
                            class="w-10 h-10"
                        >
                    </div>
                    <div class="w-20 h-20 bg-white flex items-center justify-center rounded-full hover:scale-105 cursor-pointer">
                        <img 
                            src="https://res.cloudinary.com/ospauzp7/image/upload/v1790628256/google-icon.png" 
                            alt="google logo"
                            class="w-10 h-10"
                        >
                    </div>
                </div>
                <p 
                    class="text-base text-[#2d2340] mt-6 text-center">Already have an account? 
                    <a href="/pages/login.html" class="text-[#7956C8] hover:underline hover:text-[#4a2f82]">Log In</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
