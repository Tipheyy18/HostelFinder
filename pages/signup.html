<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="/images/fav-logo.png" sizes="32*32" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <!-- Surfer -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Original+Surfer&display=swap" rel="stylesheet">
    <!-- DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <!-- Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <title>Login | HostelFinder</title>
</head>
<body>
    <main class="w-full bg-[#E6D8FC] px-15">
        <header class="w-full flex items-center justify-between p-4">
            <a href="/">
                <img class="w-48" src="/images/HostelFinderLogo.png" alt="Hostel finder logo">
            </a>

            <nav class="flex gap-8">
                <a href="/" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline cursor-pointer">Home</a>
                <a href="/" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline cursor-pointer">Browse Hostel</a>
                <a href="/" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline cursor-pointer">List your property</a>
                <a href="/" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline cursor-pointer">Login</a>
            </nav>

            <button class="capitalize bg-[#7956C8] text-white text-sm px-2 pb-3 py-2 rounded-md hover:bg-[#4a2f82] cursor-pointer">create account</button>
        </header>
        <section class="bg-[#F7F3FD] mt-20 pt-6">
            <div class="bg-[#F0E9FB] w-160 p-8 mx-auto">
                <h3 class="font-manrope capitalize text-center font-bold text-[28px]">create your account</h3>
                <p class="font-dm capitalize text-center text-base font-normal mt-1">join & find your ideal hostel</p>

                <form action="#">
                    <div class="w-full">
                        <label for="fullName" class="text-">Full Name</label>
                        <input type="text" placeholder="Chinedu Okafor">
                    </div>
                    <div class="w-full">
                        <label for="email">Email Address</label>
                        <input type="email" placeholder="name@gmail.com">
                    </div>
                    <div class="w-full">
                        <label for="phoneNumber">Phone Number</label>
                        <input type="text" placeholder="+234 8162 772 324">
                    </div>
                    <div class="w-full">
                        <label for="password">Password</label>
                        <input type="password" placeholder="At least 8 characters">
                    </div>
                    <div class="w-full">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" placeholder="Repeat your pasword">
                    </div>
                    <div class="w-full">
                        <input type="checkbox">
                        <p>I agree to the <span>terms and conditions</span> and <span>privacy policy</span></p>
                    </div>
                    <button>create account</button>
                </form>
                <p>or sign up with</p>
                <div>
                    <div>apple icon</div>
                    <div>google icon</div>
                </div>
                <p>Already have an account? <a href="/pages/login.html">Log in</a></p>
            </div>
        </section>
    </main>
</body>
</html>
