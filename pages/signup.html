<html lang="en">
<head>

    <link rel="shortcut icon" href="/images/fav-logo.png" sizes="32*32" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <!-- DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <!-- Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <title>Login | HostelFinder</title>
</head>
<body>
    <main class="w-full bg-[#E6D8FC] px-15">
        <header class="w-full flex items-center justify-between p-4">
            <a href="/">
                <img class="w-48" src="/images/HostelFinderLogo.png" alt="Hostel finder logo">
            </a>

            <nav class="flex gap-8">
                <a href="/" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline cursor-pointer">Home</a>
                <a href="/" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline cursor-pointer">Browse Hostel</a>
                <a href="/" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline cursor-pointer">List your property</a>
                <a href="/" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline cursor-pointer">Login</a>
            </nav>

            <button class="bg-[#7956C8] text-white text-sm px-2 pb-3 py-2 rounded-[6px] hover:bg-[#4a2f82] cursor-pointer">create account</button>
        </header>
        <section class="bg-[#F7F3FD] mt-20 h-64 pt-6">
            <div class="bg-[#F0E9FB] w-[640px] p-8 mx-auto">
                <h3 class="font-manrope capitalize text-center font-bold text-[28px]">create your account</h3>
                <p class="font-dm capitalize text-center text-base font-normal mt-1">join & find your ideal hostel</p>

                <form action="#">

                </form>
            </div>
        </section>
    </main>
