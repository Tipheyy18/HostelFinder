<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="/images/fav-logo.png" sizes="32x32" type="image/x-icon">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" cro    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <title>Your Inspection | HostelFinder</title>
</head>
<body class="bg-[#E6D8FC] font-[Manrope] min-h-screen">

    <!-- ===== HEADER ===== -->
    <header class="container mx-auto w-full flex items-center justify-between p-4 bg-[#E6D8FC] shadow-[0_4px_4px_rgba(37,99,235,0.15)]">
        <a href="/">
            <img class="w-48" src="/images/HostelFinderLogo.png" alt="Hostel finder logo">
        </a>

        <nav class="xl:flex gap-8 hidden items-center">
            <a href="/" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline cursor-pointer">Home</a>
            <a href="/pages/browse.html" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline cursor-pointer">Browse Properties</a>
            <a href="/pages/your-inspection.html" class="text-base font-semibold text-[#7956C8] underline cursor-pointer">View Your Inspection</a>
            <a href="#" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8] hover:underline cursor-pointer">Settings</a>
        </nav>

        <a data-auth-signup href="/pages/signup.html">
            <button class="xl:block hidden capitalize bg-[#7956C8] text-white text-sm px-4 py-2 rounded-md hover:bg-[#4a2f82] cursor-pointer">Create account</button>
        </a>
        <button data-auth-logout type="button" hidden class="xl:block hidden capitalize bg-[#7956C8] text-white text-sm px-4 py-2 rounded-md hover:bg-[#4a2f82] cursor-pointer">Logout</button>

        <div id="menu-btn" class="block xl:hidden cursor-pointer focus:outline-none" aria-label="Toggle Menu">
            <i id="menu-icon" class="bx bx-menu text-[#7956C8] text-3xl border border-[#7956C8] rounded-md"></i>
        </div>

        <div id="mobile-overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity duration-300 opacity-0 xl:hidden"></div>

        <aside id="mobile-menu" class="fixed top-0 left-0 h-full w-64 bg-[#FFFFFF] z-50 p-6 shadow-xl transform -translate-x-full transition-transform duration-300 ease-in-out xl:hidden flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between pb-6 border-b border-gray-100">
                    <a href="/">
                        <img class="w-36" src="/images/HostelFinderLogo.png" alt="Hostel finder logo">
                    </a>
                    <button id="close-menu-btn" class="text-2xl text-gray-500 hover:text-gray-800 cursor-pointer">
                        <i class="bx bx-x"></i>
                    </button>
                </div>

                <nav class="flex flex-col gap-4 mt-6">
                    <a href="/" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8]">Home</a>
                    <a href="/pages/browse.html" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8]">Browse Properties</a>
                    <a href="/pages/your-inspection.html" class="text-base font-semibold text-[#7956C8] underline">View Your Inspection</a>
                    <a href="#" class="text-base font-medium text-[#2D2340] hover:text-[#7956C8]">Settings</a>
                </nav>
            </div>

            <a data-auth-signup href="/pages/signup.html" class="w-full">
                <button class="w-full capitalize bg-[#7956C8] text-white text-sm py-2.5 rounded-md hover:bg-[#4a2f82] cursor-pointer">Create account</button>
            </a>
            <button data-auth-logout type="button" hidden class="w-full capitalize bg-[#7956C8] text-white text-sm py-2.5 rounded-md hover:bg-[#4a2f82] cursor-pointer">Logout</button>
        </aside>
    </header>

    <!-- ===== PAGE TITLE WITH BACK ARROW ===== -->
    <div class="container mx-auto px-4 md:px-10 pt-6 pb-2">
        <div class="flex items-center gap-3">
            <a href="/pages/your-inspection.html" onclick="if (document.referrer) { history.back(); return false; }" class="text-[#2D2340] hover:text-[#7956C8] transition flex items-center justify-center">
                <i class="bx bx-arrow-back text-2xl sm:text-3xl"></i>
            </a>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-[#2D2340] tracking-tight">Your Inspection</h1>
        </div>
    </div>

    <main class="container mx-auto px-4 md:px-10 pb-16 pt-4">
        
        <div class="bg-[#F8F5FE] p-4 sm:p-8 md:p-12 shadow-sm">

            
            <div class="bg-white  shadow-[0_4px_24px_rgba(121,86,200,0.12)] max-w-md mx-auto overflow-hidden p-6 sm:p-8 relative">

    
        <div class="bg-[#F8F5FE] rounded-3xl p-4 sm:p-8 md:p-12 shadow-sm">

           
                <div class="flex justify-center mb-3">
                    <img src="/images/Vector.png" alt="Inspection Completed" class="w-12 h-12 object-contain">
                </div>

                <!-- Title & Subtitle -->
                <div class="text-center mb-5">
                    <h2 class="text-xl font-extrabold text-gray-900 mb-1">Inspection Completed!</h2>
                    <p class="text-xs text-gray-500">Your inspection for Greenfields court is done.</p>
                </div>

                <!-- Property Image -->
                <div class="rounded-2xl overflow-hidden mb-5 border border-gray-100 shadow-xs">
                    <img src="https://res.cloudinary.com/ospauzp7/image/upload/v1790627411/22404c7a9e7cce6b24a8f09f9f0a8e6f5544e648.png"
                         alt="Greenfields Court" class="w-full h-48 sm:h-52 object-cover">
                </div>

                <!-- Status pill & toggle switch row -->
                <div class="flex items-center justify-between gap-2 mb-5">
                    <span class="bg-[#7956C8] text-white text-[11px] font-semibold px-4 py-1.5 rounded-full tracking-tight">
                        Completed • 01 Sept, 2025 • 12:45 PM
                    </span>
                    <!-- Green toggle switch -->
                    <label class="relative inline-flex items-center cursor-pointer flex-shrink-0">
                        <input type="checkbox" class="sr-only peer" checked disabled>
                        <div class="w-10 h-6 bg-gray-200 rounded-full peer peer-checked:bg-green-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-4 after:shadow-sm"></div>
                    </label>
                </div>

                <!-- Action buttons -->
                <div class="space-y-3 mb-5">
                    <!-- Proceed with Property -->
                    <button class="w-full bg-[#7956C8] hover:bg-[#4a2f82] text-white font-bold text-sm py-3.5 rounded-xl transition cursor-pointer shadow-sm">
                        Proceed with Property
                    </button>
                    <!-- Reject Property -->
                    <button id="reject-btn" class="w-full bg-white border border-red-400 text-red-500 hover:bg-red-50 font-bold text-sm py-3.5 rounded-xl transition cursor-pointer">
                        Reject Property
                    </button>
                </div>

                <!-- Review Property Card -->
                <div class="border border-gray-200 rounded-2xl p-4 bg-white shadow-2xs mb-5">
                    <!-- Rating Header Row -->
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs font-bold text-gray-900">Review Property</span>
                        <div class="flex items-center gap-1" id="stars">
                            <img src="/images/akar-icons_star.png" alt="star" class="w-4 h-4 object-contain star-icon cursor-pointer" data-val="1">
                            <img src="/images/akar-icons_star.png" alt="star" class="w-4 h-4 object-contain star-icon cursor-pointer" data-val="2">
                            <img src="/images/akar-icons_star.png" alt="star" class="w-4 h-4 object-contain star-icon cursor-pointer" data-val="3">
                            <img src="/images/akar-icons_star.png" alt="star" class="w-4 h-4 object-contain star-icon cursor-pointer" data-val="4">
                            <i class="bx bx-star text-gray-300 text-base cursor-pointer star-icon" data-val="5"></i>
                        </div>
                    </div>

                    <!-- Review Textarea Container -->
                    <div class="border border-gray-200 rounded-xl p-3 bg-white flex items-start justify-between gap-2 focus-within:border-[#7956C8] transition">
                        <textarea
                            placeholder="Add your review..."
                            rows="2"
                            class="w-full bg-transparent text-xs text-gray-700 placeholder-gray-400 outline-none resize-none"
                        ></textarea>
                        <img src="/images/akar-icons_edit.png" alt="Edit" class="w-4 h-4 object-contain text-gray-400 flex-shrink-0 mt-0.5">
                    </div>

                    <!-- Report Property Link -->
                    <div class="flex justify-center mt-3">
                        <button class="text-xs text-[#7956C8] hover:underline flex items-center gap-1.5 font-medium cursor-pointer">
                            <img src="/images/ant-design_flag-outlined.png" alt="Flag" class="w-3.5 h-3.5 object-contain">
                            Report Property if necessary
                        </button>
                    </div>
                </div>

                <!-- Back to Home Button -->
                <a href="/" class="block w-full">
                    <button class="w-full bg-[#EDE9FE] hover:bg-[#e2d8f9] border border-[#d5c7f7] text-[#7956C8] font-bold text-sm py-3.5 rounded-xl transition cursor-pointer">
                        Back to Home
                    </button>
                </a>

           

        </div>
    </main>

    <script src="../script.js"></script>
    <script>
        // Star rating interaction
        const stars = document.querySelectorAll('.star-icon');
        stars.forEach(star => {
            star.addEventListener('click', function () {
                const val = parseInt(this.getAttribute('data-val'));
                stars.forEach((s, i) => {
                    if (i < val) {
                        if (s.tagName.toLowerCase() === 'img') {
                            s.style.opacity = '1';
                        } else {
                            s.className = 'bx bxs-star text-[#7956C8] text-base cursor-pointer star-icon';
                        }
                    } else {
                        if (s.tagName.toLowerCase() === 'img') {
                            s.style.opacity = '0.3';
                        } else {
                            s.className = 'bx bx-star text-gray-300 text-base cursor-pointer star-icon';
                        }
                    }
                });
            });
        });

        const rejectBtn = document.getElementById('reject-btn');
        if (rejectBtn) {
            rejectBtn.addEventListener('click', () => {
                window.location.href = '/pages/browse.html';
            });
        }
    </script>
</body>
</html>
